<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div th:if="${param.errorPermiso}" class="alert alert-danger">
        ⛔ Acceso denegado: Tu perfil de <strong>Recepción</strong> no tiene permisos de Administrador.
    </div>

    <h4 class="mb-4 fw-bold">Panel General</h4>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-start border-success border-4 shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Clientes Activos</div>
                    <h2 class="fw-bold text-success" th:text="${activos}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-start border-warning border-4 shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Por Vencer (≤ 5 días)</div>
                    <h2 class="fw-bold text-warning" th:text="${porVencer}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-start border-danger border-4 shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Membresías Vencidas</div>
                    <h2 class="fw-bold text-danger" th:text="${vencidos}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-start border-primary border-4 shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Asistencias Hoy</div>
                    <h2 class="fw-bold text-primary" th:text="${asistenciasHoy}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm p-3">
                <h6 class="fw-bold mb-3">Estado de Membresías</h6>
                <canvas id="graficaMembresias"></canvas>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm p-3">
                <h6 class="fw-bold mb-3">Últimos Accesos de Hoy</h6>
                <table class="table table-sm table-hover">
                    <thead>
                    <tr><th>Hora</th><th>Código</th><th>Cliente</th><th>Resultado</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${ultimasAsistencias}">
                        <td th:text="${a.hora}"></td>
                        <td th:text="${a.cliente.codigo}"></td>
                        <td th:text="${a.cliente.nombre}"></td>
                        <td>
                            <span th:if="${a.permitido}" class="badge bg-success">✅ Permitido</span>
                            <span th:unless="${a.permitido}" class="badge bg-danger">❌ Vencida</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/js/chart.umd.js"></script>
<script th:inline="javascript">
    const activos = [[${activos - porVencer}]];
    const porVencer = [[${porVencer}]];
    const vencidos = [[${vencidos}]];

    // Colores de textos de la gráfica para fondo oscuro
    Chart.defaults.color = '#c9ced8';
    Chart.defaults.font.family = '"Segoe UI", system-ui, sans-serif';

    new Chart(document.getElementById('graficaMembresias'), {
        type: 'doughnut',
        data: {
            labels: ['Activos', 'Por Vencer', 'Vencidos'],
            datasets: [{
                data: [activos, porVencer, vencidos],
                backgroundColor: ['#22c55e', '#ffc107', '#ef4444'],
                borderColor: '#181c23',
                borderWidth: 4,
                hoverOffset: 10
            }]
        },
        options: {
            cutout: '68%',
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 18 } }
            }
        }
    });
</script>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
