<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Administración')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card bg-dark text-white p-3 mb-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <div class="text-warning small text-uppercase fw-bold">Ingresos Totales Registrados</div>
        <h2 class="fw-bold m-0" th:text="'$' + ${ingresosTotales}">$0.00</h2>
      </div>
      <span class="badge bg-warning text-dark fs-6">Exclusivo Administrador</span>
    </div>
  </div>

  <div class="row g-4">
    <!-- Crear Planes -->
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h5 class="fw-bold mb-3">Crear Plan</h5>
        <form method="post" action="/admin/planes/guardar">
          <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre (Ej: Semestral)" required>
          <input type="number" step="0.01" name="precio" class="form-control mb-2" placeholder="Precio ($)" required>
          <input type="number" name="duracionDias" class="form-control mb-3" placeholder="Duración en días (Ej: 180)" required>
          <button class="btn btn-dark w-100">Guardar Plan</button>
        </form>
      </div>
    </div>

    <!-- Crear Clases -->
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h5 class="fw-bold mb-3">Crear Clase</h5>
        <form method="post" action="/admin/clases/guardar">
          <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre (Ej: Zumba)" required>
          <input type="text" name="instructor" class="form-control mb-2" placeholder="Instructor" required>
          <select name="diaSemana" class="form-select mb-2">
            <option>Lunes</option><option>Martes</option><option>Miércoles</option>
            <option>Jueves</option><option>Viernes</option><option>Sábado</option>
          </select>
          <input type="time" name="hora" class="form-control mb-2" required>
          <input type="number" name="cupo" class="form-control mb-3" placeholder="Cupo máximo" required>
          <button class="btn btn-dark w-100">Guardar Clase</button>
        </form>
      </div>
    </div>

    <!-- Crear Usuarios -->
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h5 class="fw-bold mb-3">Crear Usuario</h5>
        <form method="post" action="/admin/usuarios/guardar">
          <input type="text" name="username" class="form-control mb-2" placeholder="Usuario" required>
          <input type="password" name="password" class="form-control mb-2" placeholder="Contraseña" required>
          <select name="rol" class="form-select mb-3">
            <option value="RECEPCION">RECEPCION</option>
            <option value="ADMIN">ADMIN</option>
          </select>
          <button class="btn btn-warning w-100 fw-bold">Crear Usuario</button>
        </form>
        <hr>
        <ul class="list-group list-group-flush small">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="u : ${usuarios}">
            <span th:text="${u.username} + ' (' + ${u.rol} + ')'"></span>
            <a th:if="${u.username != 'admin'}" th:href="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
               class="text-danger text-decoration-none">Eliminar</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
